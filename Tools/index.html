<!DOCTYPE html>
<html>
<head>
    <title>WEBInvoiceME</title>
    <style>
        body {
            background-color: #0b0921;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 75vw;
        }

        .neon-text {
            font-size: 5vw;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #fff, 0 0 40px #00f, 0 0 70px #00f, 0 0 80px #00f, 0 0 100px #00f, 0 0 150px #00f;
            animation: pulsate 4s ease-in-out infinite;
            text-align: center;
        }

        .neon-text a {
            text-decoration: none;
            color: inherit;
        }

        .neon-text-left {
            font-size: 1vw;
            text-transform: uppercase;
            color: #fff;
            text-align: left;
            width: 40%;
            float: left;
        }

        .neon-text-left a {
            text-decoration: none;
            color: inherit;
        }

        .neon-text-right {
            font-size: 1vw;
            text-transform: uppercase;
            color: #fff;
            text-align: right;
            width: 40%;
            float: right;
        }

        .neon-text-right a {
            text-decoration: none;
            color: inherit;
        }

        @keyframes pulsate {
            0% {
                opacity: 1;
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #fff, 0 0 40px #00f, 0 0 70px #00f, 0 0 80px #00f, 0 0 100px #00f, 0 0 150px #00f;
            }
            25% {
                opacity: 0.8;
            }
            50% {
                opacity: 0.6;
            }
            75% {
                opacity: 0.8;
            }
            100% {
                opacity: 1;
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #fff, 0 0 40px #00f, 0 0 70px #00f, 0 0 80px #00f, 0 0 100px #00f, 0 0 150px #00f;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div>
            <div class="neon-text">

            <div class="neon-text-left">
                <a href="https://www.maersk.com/about">For A.P.Moller-Maersk</a>
            </div>
            <div class="neon-text-right">
                <a href="https://www.fsquare.dk">By F-SQUARE ApS</a>
            </div>
        </div>
    </div>
</body>
</html>
